name: Ventory Desktop Release

on:
  push:
    tags:
      - "ventory-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build portable + folder
        shell: pwsh
        run: ./build-desktop.ps1

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VENTORY Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            Ventory.exe
            Ventory-desktop.zip
            Ventory/update.json
name: Ventory Desktop Release

# Repo publico aeeb-dev/ventory-app. Tag sobre un commit con build-desktop.ps1 en la raiz.
on:
  push:
    tags:
      - "VENTORY-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar layout del repo
        shell: pwsh
        run: |
          if (-not (Test-Path "./build-desktop.ps1")) {
            throw "Falta build-desktop.ps1 en la raiz del commit etiquetado."
          }
          if (-not (Test-Path "./ventory-tray/VentoryTray.csproj")) {
            throw "Falta ventory-tray/VentoryTray.csproj."
          }

      - name: Versión desde tag VENTORY-vX.Y.Z
        id: ver
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^VENTORY-v(\d+\.\d+\.\d+)$') {
            throw "Tag invalido: '$tag'. Usa VENTORY-vMAJOR.MINOR.PATCH (git no admite espacios en tags; el Release se titula VENTORY - vX.Y.Z)."
          }
          "product_version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build portable + carpeta
        shell: pwsh
        run: ./build-desktop.ps1 -ProductVersion ${{ steps.ver.outputs.product_version }}

      - name: Verificar artefactos
        shell: pwsh
        run: |
          if (-not (Test-Path "./Ventory.exe")) { throw "No se genero Ventory.exe" }
          $ver = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "./Ventory.exe")).FileVersion
          Write-Host "Ventory.exe FileVersion: $ver"

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VENTORY - v${{ steps.ver.outputs.product_version }}
          body_path: packaging/RELEASE_BODY.md
          draft: false
          prerelease: false
          files: |
            Ventory.exe